server {
    listen 80;
    server_name tk.shaohua.fun;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shaohua-acme;
        default_type text/plain;
    }
    location / { return 301 https://tk.shaohua.fun$request_uri; }
}
server {
    listen 443 ssl;
    server_name tk.shaohua.fun;
    ssl_certificate /etc/letsencrypt/live/tk.shaohua.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tk.shaohua.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SHAOHUA_SSL:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 256k;
    location ^~ /api/client/media/ingest/ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8810;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    location = /api/client/feedback {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8810;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
