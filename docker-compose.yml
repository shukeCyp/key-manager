services:
  key-manager:
    build: .
    container_name: key-manager
    environment:
      - TZ=Asia/Shanghai
      - ENVIRONMENT=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set a random administrator password}
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT secret}
      - DATABASE_URL=sqlite:////app/data/app.db
      - SIGNING_KEY_PATH=/app/data/signing-key.pem
      - SUITE_APP_CODE=SHAOHUA_SUITE
      - ENABLE_LEGACY_AUTH=false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
